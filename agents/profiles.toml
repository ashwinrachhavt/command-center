# Execution settings only. Behavioral directives live in agents/directives/.
# Every run pins both settings and directive/skill content.
# Secrets belong in root .env, never in prompts or this file.
[profiles.lead]
name = "Command Center assistant"
description = "Coordinate research, application preparation and outreach within the current work conversation."
provider = "openai"
model = "gpt-5-mini"
tools = ["workspace_summary", "research_search", "capture_lead", "enrich_lead", "lead_evidence", "create_task", "draft_artifact", "memory_read", "document_read", "propose_profile_fact", "approved_profile"]
delegates = ["research", "application", "outreach"]
max_steps = 16
max_output_tokens = 2500
max_tool_calls = 48
max_parallel_tools = 4
directive = "lead"

[profiles.research]
name = "Research partner"
description = "Research companies and roles, then turn findings into a clear next step."
provider = "openai"
model = "gpt-5-mini"
tools = ["workspace_summary", "research_search", "capture_lead", "enrich_lead", "lead_evidence", "create_task", "draft_artifact", "memory_read"]
skills = ["research"]
max_steps = 8
max_output_tokens = 2500
directive = "research"

[profiles.writer]
name = "Writing partner"
description = "Develop clear drafts from the facts and context you provide."
provider = "openai"
model = "gpt-5-mini"
tools = ["workspace_summary", "draft_artifact", "memory_read", "approved_profile"]
skills = ["writing"]
max_steps = 4
max_output_tokens = 2500
directive = "writer"

[profiles.application]
name = "Application specialist"
description = "Prepare grounded application answers and identify missing personal facts for review."
provider = "openai"
model = "gpt-5-mini"
tools = ["workspace_summary", "draft_artifact", "memory_read", "document_read", "propose_profile_fact", "approved_profile"]
skills = ["writing"]
max_steps = 6
max_output_tokens = 2500
directive = "application"

[profiles.outreach]
name = "Outreach specialist"
description = "Research the person and company and prepare an evidence-backed outreach draft for review."
provider = "openai"
model = "gpt-5-mini"
tools = ["workspace_summary", "research_search", "lead_evidence", "draft_artifact", "memory_read", "approved_profile"]
skills = ["research", "writing"]
max_steps = 6
max_output_tokens = 2500
directive = "outreach"

# To enable a reviewed READ-ONLY Composio tool, add a block under one profile:
# [[profiles.research.composio_tools]]
# toolkit = "your_toolkit"
# slug = "YOUR_REVIEWED_READ_TOOL"
# version = "PINNED_TOOL_VERSION"
# read_only = true
# Connect that toolkit in Settings. User identity is assigned by the backend.
