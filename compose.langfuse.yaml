name: command-center-langfuse

# Local Langfuse v4, adapted from the upstream Docker Compose deployment.
# Credentials are generated in root .env by scripts/langfuse_setup.py.
x-environment: &environment
  DATABASE_URL: postgresql://langfuse:${CC_LANGFUSE_DB_PASSWORD:?Run make langfuse-setup}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3003
  NEXTAUTH_SECRET: ${CC_LANGFUSE_AUTH_SECRET:?Run make langfuse-setup}
  SALT: ${CC_LANGFUSE_SALT:?Run make langfuse-setup}
  ENCRYPTION_KEY: ${CC_LANGFUSE_ENCRYPTION_KEY:?Run make langfuse-setup}
  TELEMETRY_ENABLED: "false"
  NODE_OPTIONS: --max-old-space-size=384
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CC_LANGFUSE_DB_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${CC_LANGFUSE_REDIS_PASSWORD:?Run make langfuse-setup}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${CC_LANGFUSE_STORAGE_PASSWORD:?Run make langfuse-setup}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${CC_LANGFUSE_STORAGE_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9092
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2
    ports: ["127.0.0.1:3003:3000"]
    environment:
      <<: *environment
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=896
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: command-center
      LANGFUSE_INIT_ORG_NAME: Command Center
      LANGFUSE_INIT_PROJECT_ID: command-center
      LANGFUSE_INIT_PROJECT_NAME: Command Center
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run make langfuse-setup}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run make langfuse-setup}
      LANGFUSE_INIT_USER_EMAIL: ${CC_LANGFUSE_USER_EMAIL:-admin@command-center.local}
      LANGFUSE_INIT_USER_NAME: Command Center
      LANGFUSE_INIT_USER_PASSWORD: ${CC_LANGFUSE_USER_PASSWORD:?Run make langfuse-setup}
    depends_on: &dependencies
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    environment: *environment
    depends_on: *dependencies

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${CC_LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.5
    user: "101:101"
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CC_LANGFUSE_DB_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./infra/langfuse/clickhouse.xml:/etc/clickhouse-server/config.d/local.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    entrypoint: sh
    command: ["-c", "mkdir -p /data/langfuse && minio server --address :9000 /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${CC_LANGFUSE_STORAGE_PASSWORD}
    ports: ["127.0.0.1:9092:9000"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command: ["redis-server", "--requirepass", "${CC_LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${CC_LANGFUSE_REDIS_PASSWORD}
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  minio:
  redis:
