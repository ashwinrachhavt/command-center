[project]
name = "command-center-api"
version = "0.1.0"
description = "Local-first Command Center API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "pyjwt[crypto]>=2.10,<3",
  "email-validator>=2.2,<3",
  "langgraph>=1,<2",
  "langchain-openai>=1,<2",
  "composio==0.21.1",
  "composio-client==1.43.0",
  "celery[redis]>=5.5,<6",
  "jsonschema>=4,<5",
  "mcp>=1.26,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "deepagents==0.7.16",
  "langgraph-checkpoint-postgres==3.1.2",
  "python-multipart>=0.0.22,<1",
  "langchain-google-genai>=4,<5",
  "langchain-mistralai>=1,<2",
  "langchain-cohere>=0.5,<1",
]

[project.optional-dependencies]
executor = ["docker>=7.2,<8"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.12,<1",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/command_center"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
