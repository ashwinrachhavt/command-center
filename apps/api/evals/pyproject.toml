[project]
name = "command-center-evaluations"
version = "0.1.0"
description = "Explicitly budgeted, synthetic Command Center agent evaluations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "command-center-api",
    "deepeval==4.2.3",
    "pytest>=8.4,<10",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
command-center-api = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["test_contracts.py"]
addopts = "-ra"
