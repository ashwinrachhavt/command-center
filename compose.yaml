name: command-center

x-api: &api
  image: command-center-api:local
  build:
    context: apps/api
  environment: &api-environment
    CC_API_TOKEN: ${CC_API_TOKEN:?Run python3 scripts/bootstrap.py}
    CC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-command_center}:${POSTGRES_PASSWORD:?Run bootstrap}@db:5432/${POSTGRES_DB:-command_center}
    CC_FIRECRAWL_URL: http://firecrawl:3002
    CC_FIRECRAWL_API_KEY: ${CC_FIRECRAWL_API_KEY:-}
    CC_SEARXNG_URL: http://searxng:8080
    CC_DOCLING_URL: http://docling:5001
    CC_DOCLING_API_KEY: ${CC_DOCLING_API_KEY:-}
    CC_BLOB_STORE_PATH: /var/lib/command-center/blobs
    CC_AUTH_MODE: clerk
    CC_CLERK_ISSUER: ${CC_CLERK_ISSUER:-}
    CC_CLERK_AUTHORIZED_PARTIES: ${CC_CLERK_AUTHORIZED_PARTIES:-["http://localhost:3001"]}
    CC_WEB_ORIGIN: http://localhost:3001
    CC_INTERNAL_API_URL: http://api:8000
    CC_REDIS_URL: redis://redis:6379/0
    CC_AGENT_DEPENDENCY_URLS: ${CC_AGENT_DEPENDENCY_URLS:-[]}
    CC_AGENT_CONFIG: /app/agents/profiles.toml
    CC_AGENT_SKILLS_DIR: /app/agents/skills
    CC_AGENT_CHECKPOINT_DATABASE_URL: ${CC_AGENT_CHECKPOINT_DATABASE_URL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    COHERE_API_KEY: ${COHERE_API_KEY:-}
    COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    APOLLO_API_KEY: ${APOLLO_API_KEY:-}
    HUNTER_API_KEY: ${HUNTER_API_KEY:-}
    CC_COMPOSIO_AUTH_CONFIGS: ${CC_COMPOSIO_AUTH_CONFIGS:-{}}
    CC_COMPOSIO_ACTION_TIMEOUT_SECONDS: ${CC_COMPOSIO_ACTION_TIMEOUT_SECONDS:-30}
    CC_RESEARCH_SANDBOX_IMAGE: ${CC_RESEARCH_SANDBOX_IMAGE:-}
    CC_PDF_RENDERER_IMAGE: ${CC_PDF_RENDERER_IMAGE:-}
  volumes:
    - ./agents:/app/agents:ro
    - document-blobs:/var/lib/command-center/blobs
  init: true

services:
  mock-web:
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /app
    command: ["node", "scripts/fixture_server.mjs"]
    environment:
      FIXTURE_HOST: 0.0.0.0
    volumes:
      - ./scripts/fixture_server.mjs:/app/scripts/fixture_server.mjs:ro
      - ./apps/web/public/fixtures:/app/apps/web/public/fixtures:ro
    ports:
      - "127.0.0.1:4319:4319"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4319/health', {signal: AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *api
    networks:
      - default
      - research
    command: ["sh", "-c", "python -m command_center.agents.readiness && exec celery -A command_center.agents.queue:celery worker --loglevel=WARNING --concurrency=${CC_AGENT_CONCURRENCY:-4} --queues=agents"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  integration-worker:
    <<: *api
    networks: [default, research]
    command: ["sh", "-c", "python -m command_center.agents.readiness && exec celery -A command_center.agents.queue:celery worker --loglevel=WARNING --concurrency=2 --queues=control,actions,documents"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  execution-worker:
    image: command-center-execution-worker:local
    build:
      context: .
      dockerfile: apps/execution-worker/Dockerfile
    environment:
      CC_API_TOKEN: ${CC_API_TOKEN:?Run bootstrap}
      CC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-command_center}:${POSTGRES_PASSWORD:?Run bootstrap}@db:5432/${POSTGRES_DB:-command_center}
      CC_REDIS_URL: redis://redis:6379/0
      CC_BLOB_STORE_PATH: /var/lib/command-center/blobs
      CC_RESEARCH_SANDBOX_IMAGE: ${CC_RESEARCH_SANDBOX_IMAGE:-}
      CC_PDF_RENDERER_IMAGE: ${CC_PDF_RENDERER_IMAGE:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - document-blobs:/var/lib/command-center/blobs
      - ${CC_EXECUTOR_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - ${CC_EXECUTOR_DOCKER_GID:-0}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  beat:
    <<: *api
    command: ["sh", "-c", "python -m command_center.agents.readiness && exec celery -A command_center.agents.queue:celery beat --loglevel=WARNING --schedule=/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-command_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap}
      POSTGRES_DB: ${POSTGRES_DB:-command_center}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - default
      - research
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
      CC_API_URL: http://api:8000
      CC_WEB_ORIGIN: http://localhost:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: command_center_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  document-blobs:
  postgres-data:
  redis-data:

networks:
  research:
    external: true
    name: ${RESEARCH_DOCKER_NETWORK:-local-services}
